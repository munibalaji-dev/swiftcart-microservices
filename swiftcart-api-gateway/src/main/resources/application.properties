spring.application.name=swiftcart-api-gateway

server.port=${PORT:1010}

spring.cloud.gateway.server.webmvc.routes[0].id=customer-service
spring.cloud.gateway.server.webmvc.routes[0].uri=${CUSTOMER_SERVICE_URL:http://localhost:7070}
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/customers/**

spring.cloud.gateway.server.webmvc.routes[1].id=product-service
spring.cloud.gateway.server.webmvc.routes[1].uri=${PRODUCT_SERVICE_URL:http://localhost:8080}
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/products/**

spring.cloud.gateway.server.webmvc.routes[2].id=order-service
spring.cloud.gateway.server.webmvc.routes[2].uri=${ORDER_SERVICE_URL:http://localhost:9090}
spring.cloud.gateway.server.webmvc.routes[2].predicates[0]=Path=/orders/**